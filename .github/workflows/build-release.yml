name: Build and release Windows x64

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Build Windows x64 binaries
        run: >-
          msbuild lfhookcfg.sln /m /t:Rebuild
          /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145
          /p:PreferredToolArchitecture=x64

      - name: Verify x64 binaries and package
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('lfhookcfg.exe', 'LocationServiceHook.dll', 'LocationDemo.exe')
          $staging = New-Item -ItemType Directory -Path artifacts/package -Force
          foreach ($file in $files) {
            $path = Join-Path 'x64/Release' $file
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path).Path)
            if ($bytes.Length -lt 64 -or [BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) {
              throw "Invalid executable: $file"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($peOffset -lt 0 -or $peOffset -gt ($bytes.Length - 6) -or
                [BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550 -or
                [BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
              throw "Expected a Windows x64 executable: $file"
            }
            Copy-Item $path $staging.FullName
          }
          Copy-Item README.md $staging.FullName
          $archive = 'artifacts/windows-location-hook-windows-x64.zip'
          Compress-Archive -Path "$($staging.FullName)/*" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" |
            Set-Content "$archive.sha256" -Encoding ascii

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: windows-location-hook-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows x64 package
        uses: actions/download-artifact@v4
        with:
          name: windows-location-hook-windows-x64
          path: artifacts

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" artifacts/* \
              --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
